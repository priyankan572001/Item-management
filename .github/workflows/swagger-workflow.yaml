name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup static site
        run: |
          mkdir -p site
          cp swagger.yaml site/
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.9.0.tar.gz -o swagger-ui.tar.gz
          tar -xzf swagger-ui.tar.gz -C site --strip-components=1
          cp -r site/* .

      - name: Deploy to gh-pages
        uses: peter-evans/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
